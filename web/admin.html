<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>운영 대시보드 · 하루한문장</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/admin.css">
<script type="module" src="/admin.js"></script>
</head>
<body class="admin-app">
<a class="skip" href="#admin-main">본문으로 이동</a>

<main id="admin-main">

<div id="dashboard" hidden>
<nav class="admin-tabs" aria-label="관리 메뉴"></nav>

</div>
</main>
<dialog id="admin-detail" aria-labelledby="admin-detail-title">
  <form method="dialog"><button class="dialog-close round" aria-label="닫기" autofocus>×</button></form>
  <div class="admin-detail-inner">
    <h2 id="admin-detail-title">문장과 댓글</h2>
    <div id="admin-detail-content" aria-live="polite"></div>
  </div>
</dialog>

</html>
